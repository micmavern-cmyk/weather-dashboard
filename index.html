<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for a city..." />
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <main>
            <!-- Current Weather Section -->
            <section class="current-weather">
                <div id="weatherCard" class="weather-card">
                    <div class="loading">Loading weather data...</div>
                </div>
            </section>

            <!-- Forecast Section -->
            <section class="forecast-section">
                <h2>5-Day Forecast</h2>
                <div id="forecastContainer" class="forecast-container">
                    <div class="loading">Loading forecast...</div>
                </div>
            </section>

            <!-- Search History -->
            <section class="history-section">
                <h2>Recent Searches</h2>
                <div id="historyContainer" class="history-container"></div>
            </section>
        </main>

        <footer>
            <p>Powered by <a href="https://openweathermap.org/" target="_blank">OpenWeather API</a></p>
            <p>&copy; 2024 Weather Dashboard. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
